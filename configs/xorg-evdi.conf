# ============================================================================
# xorg-evdi.conf — 最小 Xorg 配置：把 DisplayLink 坞的 evdi 虚拟显卡(card1)
# 作为 :1 显示输出。用于 NVIDIA DRIVE Thor / DriveOS 等无原生显示输出的板。
#
# 安放：/var/lib/xorg-evdi/xorg-evdi.conf
# 启动：Xorg :1 -config /var/lib/xorg-evdi/xorg-evdi.conf
#
# 关键说明：
#   - Driver "modesetting" + kmsdev /dev/dri/card1  → evdi 虚拟 KMS 设备
#   - 不写 InputClass/InputDevice：Xorg 靠 udev 自动发现 USB 键鼠（evdev 驱动
#     自动加载，日志见 "Configuring as keyboard/mouse"）
#   - BlankTime/StandbyTime/SuspendTime/OffTime=0 → 防屏保黑屏
#   - AllowMouseOpenFail=true → 无鼠标时也能起 X
# ============================================================================
Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen1"
EndSection

Section "Device"
    Identifier "evdi"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "Monitor1"
EndSection

Section "Screen"
    Identifier "Screen1"
    Device "evdi"
    Monitor "Monitor1"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
    Option "AllowMouseOpenFail" "true"
EndSection
